name: "Build 11ty, deploy to GitHub Pages"

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: "Build"
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read" # private repo
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false

      - name: "Setup Node"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # 7.1.0
        with:
          node-version-file: "package.json"

      - name: "Cache Eleventy .cache"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # 6.1.0
        with:
          path: "./.cache"
          key: "${{ runner.os }}-eleventy-fetch-cache"

      - run: "npm ci"
      - run: "npm run build"

      - name: "Upload static files as artifact"
        id: "deployment"
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # 5.0.0
        with:
          path: "_site/"

  deploy:
    name: "Deploy"
    environment:
      name: "github-pages"
      url: "${{ steps.deployment.outputs.page_url }}"
    runs-on: "ubuntu-latest"
    needs: "build"
    permissions:
      pages: "write" # to deploy to Pages
      id-token: "write" # to verify the deployment originates from an appropriate source
    steps:
      - name: "Deploy to GitHub Pages"
        id: "deployment"
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # 5.0.1
